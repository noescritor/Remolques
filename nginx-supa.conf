server {
    listen 80;

    location / {
        # Responder preflight OPTIONS sin ir al servidor
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, apikey, x-client-info, x-supabase-api-version';
            add_header 'Access-Control-Max-Age' '86400';
            return 204;
        }

        # Ocultar los headers CORS que manda Supabase para evitar duplicados (*, *)
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Allow-Credentials';

        # Proxy hacia Supabase
        proxy_pass http://ws2.cloud.betics.com.mx:8000;
        proxy_set_header Host ws2.cloud.betics.com.mx;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;

        # Agregar nuestros propios headers CORS limpios
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, apikey, x-client-info, x-supabase-api-version' always;
    }
}
