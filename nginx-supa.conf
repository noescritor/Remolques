server {
    listen 80;

    # Permitir cualquier origen
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, apikey, x-client-info, x-supabase-api-version' always;
    add_header 'Access-Control-Max-Age' '86400' always;

    location / {
        # Responder preflight OPTIONS sin ir al servidor
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Proxy hacia tu Supabase en DigitalOcean
        proxy_pass http://ws2.cloud.betics.com.mx:8000;

        proxy_set_header Host ws2.cloud.betics.com.mx;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tamaño máximo de cuerpo (para uploads de archivos)
        client_max_body_size 50M;

        # Timeouts generosos
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }
}
